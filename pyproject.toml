[build-system]
requires = ["setuptools>=82"]
build-backend = "setuptools.build_meta"

[project]
name = "review-benchmark"
version = "0.1.0"
description = "Evidence-backed benchmark contracts and offline scoring for automated code review."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fly Over Coder" }]
dependencies = []

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "ruff>=0.16,<0.17",
]

[project.scripts]
review-benchmark = "review_benchmark.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
