name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . "pytest>=9,<10" "ruff>=0.16,<0.17"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/generate_pilot_fixtures.py --check
      - run: python -m review_benchmark validate-release fixtures/public-v0.1
