name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install -e . "pytest>=9,<10" "ruff>=0.16,<0.17"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python scripts/generate_pilot_fixtures.py --check
      - run: python -m review_benchmark validate-release fixtures/public-v0.1
      - run: python -m review_benchmark validate-release fixtures/public-v0.2
      - run: python -m review_benchmark validate-release fixtures/public-v0.3
      - run: python -m pytest -q tests
        working-directory: fixtures/public-v0.3/tasks/planted-mini-clean/checkout
